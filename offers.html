<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Student Offers · OppVault</title><link rel="stylesheet" href="styles.css"/></head><body>
<nav class="nav"><a class="brand" href="index.html">Opp<span>Vault</span></a><button class="menu" type="button">Menu</button><div class="links"><a href="about.html">About</a><a href="offers.html" aria-current="page">Student Offers</a><a href="faq.html">FAQ</a><a href="courses.html">Free Courses</a><a href="scholarships.html">Scholarships</a><a href="fellowships.html">Fellowships</a></div></nav>
<main class="wrap"><section class="section"><div class="kicker">Student offers</div><h2>Search the open vault.</h2><div class="actions"><input id="q" placeholder="Spotify, Adobe, GitHub" style="border-radius:999px;border:1px solid rgba(232,195,106,.28);background:#10131a;color:#f6f1e6;padding:12px 14px;min-width:180px"/><button class="btn gold" id="go" type="button">Search</button><a class="btn" href="https://studentoffers-backend.vercel.app/offers.xlsx">Excel</a></div><p class="muted" id="meta">Loading the directory…</p><div class="list" id="list"></div></section><footer>Original is the StudentOffers page. Claim is the brand page.</footer></main>
<script>
document.querySelector('.menu').onclick=()=>document.querySelector('.links').classList.toggle('open');
const API='https://studentoffers-backend.vercel.app';
const list=document.querySelector('#list'); const meta=document.querySelector('#meta'); const q=document.querySelector('#q');
async function load(){ meta.textContent='Loading…'; const search=new URLSearchParams({limit:'24'}); if(q.value.trim()) search.set('q', q.value.trim()); const res=await fetch(API+'/offers?'+search.toString()); if(!res.ok){ meta.textContent='Could not load offers.'; return;} const data=await res.json(); list.innerHTML=''; data.offers.forEach(offer=>{ const card=document.createElement('article'); card.className='row'; card.innerHTML="<h3></h3><p></p><div class='actions'><a class='btn' target='_blank' rel='noopener'>Original</a><a class='btn gold' target='_blank' rel='noopener'>Claim</a></div>"; card.querySelector('h3').textContent=offer.name; card.querySelector('p').textContent=offer.offer+(offer.category_main?' · '+offer.category_main:''); const [original,claim]=card.querySelectorAll('a'); original.href=offer.original_link||'#'; claim.href=offer.claim_url||offer.original_link||'#'; list.append(card); }); meta.textContent=data.total+' offers'; }
document.querySelector('#go').onclick=load; q.addEventListener('keydown', e=>{ if(e.key==='Enter') load(); }); load();
</script></body></html>
